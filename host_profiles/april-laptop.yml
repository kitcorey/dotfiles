# ThinkPad X220. Loaded by site.yml when the hostname matches this file name.
ssh_sleep_inhibit: true

tlp_enabled: true
# TLP's tp_smapi support is off on this machine.
tlp_tpsmapi_enable: false
tlp_charge_thresholds:
  battery: BAT0
  start: 75
  stop: 80

# Fresco Logic FL1100 ExpressCard USB 3.0 adapter.
fl1100_no_autosuspend: true

# Scroll by holding the TrackPoint's middle button.
trackpoint_scroll_method: on-button-down

# Ethernet + AX210 Wi-Fi on the same LAN: stop ARP flux so the wired
# connection gets its routes.
multihomed_arp_fix: true

# Echo Dot udev rules.
firebreak: true

# GNOME Terminal ignores OSC 52; send tmux copies to wl-copy instead.
tmux_wayland_clipboard: true

# Mozilla's Firefox deb instead of the snap, so 1Password's extension works.
firefox_mozilla_deb: true

# Mostly used unplugged; install security updates on battery too.
unattended_upgrades_on_battery: true
