# Everything is off by default. Hosts opt in from host_profiles/<hostname>.yml
# (committed) or ~/.config/dotfiles/local.yml (uncommitted); see site.yml.

# Let this user take sleep/idle/lid-switch inhibitor locks from SSH sessions.
# zshrc takes the lock on SSH login when it can; without this polkit rule,
# logind only allows that for local (active) sessions.
ssh_sleep_inhibit: false

# Install and enable TLP. Ubuntu's tlp package conflicts with
# power-profiles-daemon, so installing it removes that.
tlp_enabled: false
# false writes /etc/tlp.d/50-no-tpsmapi.conf with TPSMAPI_ENABLE=0.
tlp_tpsmapi_enable: true
# Empty means no thresholds are set. Example:
#   tlp_charge_thresholds: { battery: BAT0, start: 75, stop: 80 }
tlp_charge_thresholds: {}

# Keep a Fresco Logic FL1100 ExpressCard USB 3.0 controller out of runtime
# suspend; it fails to resume and its ports go dead.
fl1100_no_autosuspend: false

# GNOME scroll method for the TrackPoint (pointing stick), e.g.
# 'on-button-down' to scroll while the middle button is held. Written as a
# system-wide dconf default (/etc/dconf/db/local.d), so a value set with
# gsettings overrides it. Empty means no default is written (and removes ours).
trackpoint_scroll_method: ''

# For hosts with more than one interface on the same subnet (e.g. Ethernet +
# Wi-Fi): make each interface answer ARP only for its own addresses. Without
# this, the other interface answers for it, NetworkManager sees an address
# conflict with the host itself, and the wired connection comes up without
# routes. Writes /etc/sysctl.d/90-arp-multihomed.conf.
multihomed_arp_fix: false

# Pipe tmux copies to wl-copy, for terminals that ignore OSC 52 (GNOME
# Terminal/VTE) on Wayland. Installs wl-clipboard and writes
# ~/.config/tmux/local.d/clipboard.conf, which tmux.conf sources if present.
tmux_wayland_clipboard: false

# Install Firefox as Mozilla's .deb from packages.mozilla.org, so
# the 1Password extension can reach the desktop app (1Password rejects the
# snap's portal-launched native-messaging host). Ubuntu only. Pins firefox* to
# Mozilla's repo and lets unattended-upgrades install Firefox updates. It
# doesn't touch the snap or profiles: copying the profile to ~/.mozilla and
# `snap remove firefox` are manual. Off removes the repo, key, pin and
# unattended-upgrades file; the next apt upgrade then brings back the snap.
firefox_mozilla_deb: false

# Let apt's daily jobs refresh package lists and install unattended upgrades
# on battery. By default both the systemd units (ConditionACPower=true) and
# unattended-upgrades (OnlyOnACPower) skip the day's run when unplugged, so a
# laptop used on battery can go days without security updates. Debian/Ubuntu.
# Writes /etc/apt/apt.conf.d/51unattended-upgrades-on-battery and systemd
# drop-ins for apt-daily and apt-daily-upgrade.
unattended_upgrades_on_battery: false
