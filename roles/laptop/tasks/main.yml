# Laptop-only system settings, each opt-in; see defaults/main.yml. Every file
# is written when its setting is on and removed when it is off, so turning a
# setting off undoes it. The tlp package and service are left alone when
# tlp_enabled is off.

# --- SSH sleep inhibit -------------------------------------------------------
# polkit picks up changes in rules.d on its own, so no handler is needed.
- name: Allow inhibiting sleep from SSH sessions (polkit)
  template:
    src: 50-inhibit.rules.j2
    dest: "/etc/polkit-1/rules.d/50-{{ ansible_facts['user_id'] }}-inhibit.rules"
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
    - ssh_sleep_inhibit | bool
    - ansible_facts['system'] == 'Linux'

- name: Remove SSH sleep inhibit polkit rule
  file:
    path: "/etc/polkit-1/rules.d/50-{{ ansible_facts['user_id'] }}-inhibit.rules"
    state: absent
  become: true
  when:
    - not (ssh_sleep_inhibit | bool)
    - ansible_facts['system'] == 'Linux'

# --- TLP ---------------------------------------------------------------------
- name: Install TLP
  package:
    name: tlp
    state: present
  become: true
  when:
    - tlp_enabled | bool
    - ansible_facts['system'] == 'Linux'
  notify: Apply TLP settings

- name: Enable and start TLP
  systemd:
    name: tlp
    enabled: true
    state: started
  become: true
  when:
    - tlp_enabled | bool
    - ansible_facts['system'] == 'Linux'

- name: Configure TLP tp_smapi drop-in
  copy:
    content: "TPSMAPI_ENABLE=0\n"
    dest: /etc/tlp.d/50-no-tpsmapi.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
    - tlp_enabled | bool
    - not (tlp_tpsmapi_enable | bool)
    - ansible_facts['system'] == 'Linux'
  notify: Apply TLP settings

- name: Remove TLP tp_smapi drop-in
  file:
    path: /etc/tlp.d/50-no-tpsmapi.conf
    state: absent
  become: true
  when:
    - not (tlp_enabled | bool) or (tlp_tpsmapi_enable | bool)
    - ansible_facts['system'] == 'Linux'
  notify: Apply TLP settings

- name: Configure TLP battery charge thresholds
  copy:
    content: |
      START_CHARGE_THRESH_{{ tlp_charge_thresholds.battery }}={{ tlp_charge_thresholds.start }}
      STOP_CHARGE_THRESH_{{ tlp_charge_thresholds.battery }}={{ tlp_charge_thresholds.stop }}
    dest: /etc/tlp.d/60-charge-thresholds.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
    - tlp_enabled | bool
    - tlp_charge_thresholds | default({}, true) | length > 0
    - ansible_facts['system'] == 'Linux'
  notify: Apply TLP settings

- name: Remove TLP battery charge thresholds
  file:
    path: /etc/tlp.d/60-charge-thresholds.conf
    state: absent
  become: true
  when:
    - not (tlp_enabled | bool) or (tlp_charge_thresholds | default({}, true) | length == 0)
    - ansible_facts['system'] == 'Linux'
  notify: Apply TLP settings

# --- FL1100 ExpressCard ------------------------------------------------------
- name: Keep FL1100 ExpressCard USB 3.0 controller awake (udev)
  copy:
    src: 99-fl1100-no-autosuspend.rules
    dest: /etc/udev/rules.d/99-fl1100-no-autosuspend.rules
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
    - fl1100_no_autosuspend | bool
    - ansible_facts['system'] == 'Linux'
  notify: Reload udev rules (laptop)

- name: Remove FL1100 udev rule
  file:
    path: /etc/udev/rules.d/99-fl1100-no-autosuspend.rules
    state: absent
  become: true
  when:
    - not (fl1100_no_autosuspend | bool)
    - ansible_facts['system'] == 'Linux'
  notify: Reload udev rules (laptop)

# --- TrackPoint --------------------------------------------------------------
# A system-wide dconf default, so it needs no desktop session and works over
# SSH. A value the user sets with gsettings still wins. dconf only reads the
# system "local" db when /etc/dconf/profile/user lists it, so the profile gets
# that line added; other entries (distro dbs, lockdowns) are left alone.
# Turning the setting off removes only the keyfile: the profile may be shared,
# so its system-db:local line stays (harmless). Running sessions pick up a
# changed profile at the next login.
- name: Configure TrackPoint scroll method default (dconf)
  when:
    - trackpoint_scroll_method | default('', true) | length > 0
    - ansible_facts['system'] == 'Linux'
  become: true
  block:
    - name: Install dconf CLI
      package:
        name: "{{ 'dconf-cli' if ansible_facts['os_family'] == 'Debian' else 'dconf' }}"
        state: present

    - name: Create dconf profile and keyfile directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/dconf/profile
        - /etc/dconf/db/local.d

    # The user db must come first so the user's own settings win.
    - name: Make the dconf user profile read the user db
      lineinfile:
        path: /etc/dconf/profile/user
        regexp: '^user-db:'
        line: user-db:user
        insertbefore: BOF
        create: true
        owner: root
        group: root
        mode: '0644'
      notify: Update dconf databases (laptop)

    - name: Make the dconf user profile read the system local db
      lineinfile:
        path: /etc/dconf/profile/user
        line: system-db:local
        insertafter: '^user-db:'
      notify: Update dconf databases (laptop)

    - name: Set TrackPoint scroll method default
      copy:
        content: |
          [org/gnome/desktop/peripherals/pointingstick]
          scroll-method='{{ trackpoint_scroll_method }}'
        dest: /etc/dconf/db/local.d/50-trackpoint
        owner: root
        group: root
        mode: '0644'
      notify: Update dconf databases (laptop)

- name: Remove TrackPoint scroll method default (dconf)
  file:
    path: /etc/dconf/db/local.d/50-trackpoint
    state: absent
  become: true
  when:
    - trackpoint_scroll_method | default('', true) | length == 0
    - ansible_facts['system'] == 'Linux'
  notify: Update dconf databases (laptop)

# --- Multi-homed ARP ---------------------------------------------------------
- name: Stop ARP flux between interfaces on the same subnet (sysctl)
  copy:
    src: 90-arp-multihomed.conf
    dest: /etc/sysctl.d/90-arp-multihomed.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  when:
    - multihomed_arp_fix | bool
    - ansible_facts['system'] == 'Linux'
  notify: Load multi-homed ARP sysctl settings (laptop)

- name: Remove multi-homed ARP sysctl drop-in
  file:
    path: /etc/sysctl.d/90-arp-multihomed.conf
    state: absent
  become: true
  when:
    - not (multihomed_arp_fix | bool)
    - ansible_facts['system'] == 'Linux'
  notify: Reset multi-homed ARP sysctl settings (laptop)

# --- tmux system clipboard ---------------------------------------------------
# tmux.conf sends copies with OSC 52, which iTerm2 honors but VTE ignores.
# copy-command makes copy-pipe (y, mouse drag) also pipe the selection to
# wl-copy. Running tmux servers pick it up on `prefix r` or restart.
- name: Pipe tmux copies to the Wayland clipboard
  when:
    - tmux_wayland_clipboard | bool
    - ansible_facts['system'] == 'Linux'
  block:
    - name: Install wl-clipboard
      package:
        name: wl-clipboard
        state: present
      become: true

    - name: Create tmux config directory
      file:
        path: "{{ user_home }}/.config/tmux/local.d"
        state: directory
        mode: '0755'

    - name: Write host-local tmux config
      copy:
        content: |
          # Managed by ansible (laptop role, tmux_wayland_clipboard).
          # The server may have started without WAYLAND_DISPLAY (e.g. over
          # SSH); default it so wl-copy can reach the compositor.
          set -s copy-command 'WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0} wl-copy --type text/plain'
        dest: "{{ user_home }}/.config/tmux/local.d/clipboard.conf"
        mode: '0644'

- name: Remove host-local tmux clipboard config
  file:
    path: "{{ user_home }}/.config/tmux/local.d/clipboard.conf"
    state: absent
  when: not (tmux_wayland_clipboard | bool)

# --- Firefox (Mozilla deb) ---------------------------------------------------
# Installs Mozilla's deb so 1Password's extension can reach the desktop app
# (1Password rejects the snap's portal-launched native-messaging host). The
# deb replaces Ubuntu's transitional firefox package. This role doesn't touch
# the snap or profiles: copying the profile from ~/snap/firefox/common/.mozilla
# to ~/.mozilla, then `snap remove firefox` (which deletes ~/snap/firefox), are
# one-time manual steps.
- name: Install Firefox from Mozilla's apt repo
  when:
    - firefox_mozilla_deb | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['distribution'] == 'Ubuntu'
  vars:
    firefox_mozilla_key: /etc/apt/keyrings/packages.mozilla.org.asc
    firefox_mozilla_key_cache: "{{ user_home }}/.cache/dotfiles/packages.mozilla.org.asc"
    firefox_mozilla_key_fpr: '35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3'
  block:
    # The key is fetched to the cache and its fingerprint checked before it
    # reaches /etc/apt/keyrings, so apt never trusts a swapped key. These
    # steps touch only the cache, so they also run under --check.
    - name: Create the dotfiles cache directory
      file:
        path: "{{ user_home }}/.cache/dotfiles"
        state: directory
        mode: '0755'
      check_mode: false

    - name: Download Mozilla's apt signing key
      get_url:
        url: https://packages.mozilla.org/apt/repo-signing-key.gpg
        dest: "{{ firefox_mozilla_key_cache }}"
        # Re-fetch every run so a rotated key shows up (and fails the check).
        force: true
        mode: '0644'
      check_mode: false

    - name: Read the signing key's fingerprint
      shell: >-
        gpg --show-keys --with-colons {{ firefox_mozilla_key_cache | quote }}
        | awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print $10; p = 0 }'
      register: firefox_key_fpr
      changed_when: false
      check_mode: false

    - name: Check the signing key is Mozilla's
      assert:
        that: firefox_key_fpr.stdout_lines == [firefox_mozilla_key_fpr]
        fail_msg: >-
          {{ firefox_mozilla_key_cache }} has primary fingerprint(s)
          {{ firefox_key_fpr.stdout_lines }}, expected {{ firefox_mozilla_key_fpr }}.
          Not installing it.
        quiet: true

    - name: Install Mozilla's apt signing key
      copy:
        src: "{{ firefox_mozilla_key_cache }}"
        remote_src: true
        dest: "{{ firefox_mozilla_key }}"
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Add Mozilla's apt repository
      apt_repository:
        repo: deb [signed-by={{ firefox_mozilla_key }}] https://packages.mozilla.org/apt mozilla main
        filename: mozilla
        state: present
      become: true

    # 1000, not 600 like gh: Ubuntu's transitional firefox (1:1snap1-...) has
    # an epoch, so it outranks every Mozilla version. Only a pin of 1000 or
    # more lets apt replace it. firefox* (not Mozilla's suggested *) keeps the
    # pin to Firefox and its language packs.
    - name: Prefer Firefox from Mozilla's repo
      copy:
        dest: /etc/apt/preferences.d/mozilla
        content: |
          Package: firefox*
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Install Firefox from Mozilla's repo
      apt:
        name: firefox
        state: latest
        update_cache: yes
        allow_downgrade: yes
      become: true
      # Depends on the repo added above, which --check doesn't add.
      ignore_errors: "{{ ansible_check_mode }}"

    # 1Password trusts /usr/lib/firefox/firefox directly. A portal entry
    # would trust every app launched through xdg-desktop-portal.
    - name: Drop xdg-desktop-portal from 1Password's browser allowlist
      lineinfile:
        path: /etc/1password/custom_allowed_browsers
        regexp: '^\s*(/usr/libexec/)?xdg-desktop-portal\s*$'
        state: absent
      become: true

    # site=, not origin=: the repo's Release file has Origin:
    # namespaces/moz-fx-productdelivery-pr-38b5/repositories/mozilla, so
    # origin=packages.mozilla.org would match nothing.
    - name: Let unattended-upgrades install Firefox updates
      copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-mozilla
        content: |
          // Managed by ansible (laptop role, firefox_mozilla_deb).
          Unattended-Upgrade::Origins-Pattern:: "site=packages.mozilla.org";
        owner: root
        group: root
        mode: '0644'
      become: true

# Leaves the installed Firefox and profiles alone. Without the pin, Ubuntu's
# transitional firefox (1:1snap1-..., epoch 1) outranks the deb again, so the
# next apt upgrade replaces it and reinstalls the snap.
- name: Remove Mozilla's apt repo, key, pin and unattended-upgrades file
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/mozilla.list
    - /etc/apt/preferences.d/mozilla
    - /etc/apt/keyrings/packages.mozilla.org.asc
    - /etc/apt/apt.conf.d/51unattended-upgrades-mozilla
  become: true
  when:
    - not (firefox_mozilla_deb | bool)
    - ansible_facts['system'] == 'Linux'

# --- Unattended upgrades on battery ------------------------------------------
# Two gates skip apt's daily run on battery: ConditionACPower=true in the
# apt-daily{,-upgrade}.service units, and unattended-upgrades' own
# OnlyOnACPower. An empty ConditionACPower= in a drop-in clears the unit's
# conditions (it has no others).
- name: Allow unattended upgrades on battery
  when:
    - unattended_upgrades_on_battery | bool
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['os_family'] == 'Debian'
  become: true
  block:
    - name: Set unattended-upgrades OnlyOnACPower to false
      copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-on-battery
        content: |
          // Managed by ansible (laptop role, unattended_upgrades_on_battery).
          Unattended-Upgrade::OnlyOnACPower "false";
        owner: root
        group: root
        mode: '0644'

    - name: Create apt-daily drop-in directories
      file:
        path: "/etc/systemd/system/{{ item }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - apt-daily
        - apt-daily-upgrade

    - name: Let apt-daily units run on battery (systemd drop-ins)
      copy:
        dest: "/etc/systemd/system/{{ item }}.service.d/50-on-battery.conf"
        content: |
          # Managed by ansible (laptop role, unattended_upgrades_on_battery).
          [Unit]
          ConditionACPower=
        owner: root
        group: root
        mode: '0644'
      loop:
        - apt-daily
        - apt-daily-upgrade
      notify: Reload systemd units (laptop)

- name: Remove unattended upgrades on battery settings
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/51unattended-upgrades-on-battery
    - /etc/systemd/system/apt-daily.service.d/50-on-battery.conf
    - /etc/systemd/system/apt-daily-upgrade.service.d/50-on-battery.conf
  become: true
  when:
    - not (unattended_upgrades_on_battery | bool)
    - ansible_facts['system'] == 'Linux'
  notify: Reload systemd units (laptop)
