# Only when TLP is on: with it off, the package may not be installed, and
# removed drop-ins take effect the next time TLP starts.
- name: Apply TLP settings
  command: tlp start
  become: true
  when: tlp_enabled | bool

# Reload only: the FL1100 rule matches ACTION=="add", so it takes effect on
# the next boot or replug, not on devices that are already present.
- name: Reload udev rules (laptop)
  command: udevadm control --reload
  become: true

# Compiles /etc/dconf/db/*.d keyfiles into the binary dbs dconf reads.
- name: Update dconf databases (laptop)
  command: dconf update
  become: true

# Loads only our drop-in, so runtime values set elsewhere are left alone.
- name: Load multi-homed ARP sysctl settings (laptop)
  command: sysctl -p /etc/sysctl.d/90-arp-multihomed.conf
  become: true

# Deleting the drop-in doesn't change values already loaded, so set them back
# to the kernel defaults now instead of waiting for a reboot.
- name: Reset multi-homed ARP sysctl settings (laptop)
  command: sysctl -w net.ipv4.conf.all.arp_ignore=0 net.ipv4.conf.all.arp_announce=0
  become: true
