# For hosts with more than one interface on the same subnet (e.g. Ethernet +
# Wi-Fi). By default Linux answers ARP for any local address on any interface,
# so the Wi-Fi interface answers for the Ethernet address: NetworkManager's
# conflict check then sees the host's own Wi-Fi MAC and brings the wired
# connection up without routes.
# arp_ignore=1: reply only on the interface that owns the target address.
# arp_announce=2: always use the outgoing interface's own address as source.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
