# Each file is imported with its own tag (on top of the role's `dotfiles` tag),
# so `ansible-playbook site.yml -t vim` runs just that part. import_tasks, not
# include_tasks: an import's tags apply to every task in the file. Tasks that
# another tag depends on carry that tag too (e.g. the mise apt tasks are also
# tagged `mise`, so `-t mise` installs mise before `mise install`).

# Directories several files write into.
- name: Ensure ~/.local/bin directory exists
  tags: always
  file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: '0755'

- name: Ensure ~/.config directory exists
  tags: always
  file:
    path: "{{ user_home }}/.config"
    state: directory
    mode: '0755'

- import_tasks: packages.yml
  tags: packages

- import_tasks: ca.yml
  tags: ca

- import_tasks: shell.yml
  tags: shell

- import_tasks: git.yml
  tags: git

- import_tasks: vim.yml
  tags: vim

- import_tasks: nvim.yml
  tags: nvim

- import_tasks: tmux.yml
  tags: tmux

- import_tasks: tools.yml
  tags: tools

- import_tasks: mise.yml
  tags: mise

- import_tasks: claude.yml
  tags: claude
