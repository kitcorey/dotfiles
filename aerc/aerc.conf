# aerc settings. Anything not set here keeps aerc's default; see aerc-config(5).
# Accounts live in accounts.conf, which the aerc role renders from
# `aerc_accounts` (it's never committed).

[ui]
threading-enabled = true
fuzzy-complete = true

[compose]
# Runs in aerc's embedded terminal. Compose buffers are *.eml, so neovim sets
# filetype=mail (see nvim/lua/init.lua for the mail settings).
editor = nvim
# Show From/To/Cc/Subject in the buffer so they can be edited in neovim.
edit-headers = true
empty-subject-warning = true
reply-to-self = false

[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
# aerc's stock `html` filter sandboxes w3m with `unshare --net`, which fails on
# Ubuntu (AppArmor blocks unprivileged user namespaces). w3m -dump renders
# stdin to text and never fetches remote content (images, trackers), so call it
# directly. display_link_number marks each link [n] and lists the URLs under
# "References" at the end, so image-only buttons (sign-in links) still show
# where they go.
text/html = w3m -I UTF-8 -O UTF-8 -T text/html -dump -cols 100 -o display_link_number=true -o decode_url=true -o use_cookie=false -o no_cache=true | colorize
.headers = colorize
